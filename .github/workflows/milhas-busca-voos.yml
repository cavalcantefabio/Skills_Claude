# Busca automática de voos do Milhas Inteligentes AI (Alertas de Voos).
# Roda por volta de 8h e 20h de Brasília. Precisa de dois segredos do repositório
# (Settings → Secrets and variables → Actions):
#   MILHAS_APP_URL      endereço do app, ex.: https://milhas-inteligentes.onrender.com
#   MILHAS_CRON_SECRET  a mesma senha cadastrada no Render como CRON_SECRET
name: Milhas - busca automática de voos

on:
  schedule:
    - cron: "47 10,22 * * *" # 07:47 e 19:47 em Brasília (o app leva ~1 min para acordar)
  workflow_dispatch: {}

permissions: {}

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acordar o app e buscar voos
        env:
          APP_URL: ${{ secrets.MILHAS_APP_URL }}
          CRON_SECRET: ${{ secrets.MILHAS_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Segredos MILHAS_APP_URL e MILHAS_CRON_SECRET não configurados; nada a fazer."
            exit 0
          fi
          APP_URL="${APP_URL%/}"
          # No plano gratuito do Render o app dorme: espera ele responder.
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS -o /dev/null --max-time 60 "$APP_URL/login"; then break; fi
            echo "App ainda acordando (tentativa $i)…"; sleep 20
          done
          curl -fsS --max-time 900 -X POST "$APP_URL/api/cron/voos" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | tee resultado.json
          echo
